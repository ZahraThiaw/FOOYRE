# FOOYRE — environnement LOCAL de développement (MVP-0) : PostgreSQL uniquement.
# Le backend (./mvnw) et le frontend (npm run dev) s'exécutent sur la machine hôte.
# Ce fichier n'est PAS une configuration de production (lot B2 : images, Nginx, secrets, TLS).
#
# Variables : fichier .env à la racine (copie de .env.example), lu automatiquement par Docker Compose.
name: fooyre

services:
  postgres:
    image: postgres:18.7-alpine
    container_name: fooyre-postgres
    restart: unless-stopped
    environment:
      # Superutilisateur de l'image : administration uniquement (jamais utilisé par l'application).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD manquant (voir .env.example)}
      # UTF-8, tri déterministe indépendant de la bibliothèque C de l'image.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
      # Lus par infra/postgres/init/01-roles.sh (premier démarrage uniquement).
      FOOYRE_DB_NAME: ${POSTGRES_DB:?POSTGRES_DB manquant}
      FOOYRE_OWNER_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER manquant}
      FOOYRE_OWNER_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD manquant}
      FOOYRE_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER manquant}
      FOOYRE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD manquant}
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      # Accessible uniquement depuis la machine locale (jamais 0.0.0.0).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 : volume monté sur /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP sur 127.0.0.1 : pendant l'initialisation, le serveur n'écoute que sur son socket local ;
      # le conteneur n'est donc « healthy » qu'une fois la base et les rôles créés.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${FOOYRE_DB_NAME}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: fooyre-pgdata

# FOOYRE — messages du backend (français, D16). Encodage UTF-8 (spring.messages.encoding).
# Les codes (VALIDATION_ERROR…) sont stables ; title/detail ne sont qu'un complément :
# le frontend affiche ses propres traductions à partir du code.

# --- Erreurs (Problem Details) ---
error.VALIDATION_ERROR.title=Données invalides
error.VALIDATION_ERROR.detail=La requête contient des données manquantes ou invalides.
error.SESSION_REVOKED.title=Authentification requise
error.SESSION_REVOKED.detail=La session est absente, expirée ou révoquée.
error.INVALID_CREDENTIALS.title=Identifiants incorrects
error.INVALID_CREDENTIALS.detail=L'adresse e-mail ou le mot de passe est incorrect.
error.CSRF_CHECK_FAILED.title=Requête refusée
error.CSRF_CHECK_FAILED.detail=La requête a été refusée par mesure de sécurité.
error.FORBIDDEN.title=Accès refusé
error.FORBIDDEN.detail=Vous n'avez pas les droits nécessaires pour cette action.
error.NOT_FOUND.title=Ressource introuvable
error.NOT_FOUND.detail=La ressource demandée n'existe pas.
error.RATE_LIMITED.title=Trop de tentatives
error.RATE_LIMITED.detail=Trop de tentatives en peu de temps. Réessayez plus tard.
error.OPTIMISTIC_LOCK.title=Modification concurrente
error.OPTIMISTIC_LOCK.detail=Ces données ont été modifiées entre‑temps. Actualisez puis réessayez.
error.INVALID_STATE_TRANSITION.title=Action impossible
error.INVALID_STATE_TRANSITION.detail=Cette action n'est pas possible dans l'état actuel.
error.INSUFFICIENT_STOCK.title=Stock insuffisant
error.INSUFFICIENT_STOCK.detail=La quantité disponible ne permet pas cette opération.
error.IDEMPOTENCY_KEY_REUSED.title=Opération déjà envoyée
error.IDEMPOTENCY_KEY_REUSED.detail=Cette clé d'idempotence a déjà été utilisée pour une autre opération.
error.STOCK_ALREADY_INITIALIZED.title=Stock déjà initialisé
error.STOCK_ALREADY_INITIALIZED.detail=Le stock de ce produit est déjà initialisé ; utilisez un ajustement.
error.STOCK_NOT_INITIALIZED.title=Stock non initialisé
error.STOCK_NOT_INITIALIZED.detail=Initialisez le stock de ce produit avant toute autre opération.
error.PRODUCT_ARCHIVED.title=Produit archivé
error.PRODUCT_ARCHIVED.detail=Ce produit est archivé : aucune nouvelle opération n'est possible.
error.ALREADY_ARCHIVED.title=Déjà archivé
error.ALREADY_ARCHIVED.detail=Cet élément est déjà archivé.
error.INTERNAL_ERROR.title=Erreur interne
error.INTERNAL_ERROR.detail=Une erreur inattendue est survenue. Communiquez la référence au support.

# --- Statuts sans code stable documenté ---
error.HTTP_405.title=Méthode non autorisée
error.HTTP_405.detail=Cette méthode HTTP n'est pas acceptée pour cette ressource.
error.HTTP_406.title=Format de réponse non disponible
error.HTTP_406.detail=Le format de réponse demandé n'est pas disponible.
error.HTTP_413.title=Requête trop volumineuse
error.HTTP_413.detail=La taille de la requête dépasse la limite autorisée.
error.HTTP_415.title=Format non pris en charge
error.HTTP_415.detail=Le format du contenu envoyé n'est pas pris en charge.

# --- Erreurs de champ ---
field-error.REQUIRED=Ce champ est obligatoire.
field-error.INVALID_FORMAT=Le format n'est pas valide.
field-error.TOO_LONG=La valeur est trop longue.
field-error.TOO_SHORT=La valeur est trop courte.
field-error.INVALID_VALUE=La valeur n'est pas valide.
field-error.ALREADY_EXISTS=Cette valeur est déjà utilisée.
field-error.ARCHIVED=Cet élément est archivé.
field-error.LOCKED=Cette valeur ne peut plus être modifiée.
error.SALE_ALREADY_CONFIRMED.title=Vente déjà confirmée
error.SALE_ALREADY_CONFIRMED.detail=Cette vente a déjà été confirmée.
error.DISCOUNT_LIMIT_EXCEEDED.title=Remise trop élevée
